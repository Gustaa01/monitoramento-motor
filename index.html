<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Industrial - Motor</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e2f;
            --panel-secondary: #28283b;
            --text-main: #ffffff;
            --text-muted: #a0a0b5;
            --accent-blue: #00d2ff;
            --alert-red: #ff4757;
            --ok-green: #2ed573;
            --warn-yellow: #ffa502;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-blue);
        }

        .motor-title {
            min-width: 0;
        }

        .motor-title label {
            display: block;
            margin-bottom: 3px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .motor-title input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--text-muted);
            color: var(--accent-blue);
            font-size: 28px;
            font-weight: bold;
            width: 400px;
            max-width: 100%;
            outline: none;
        }

        .motor-title input:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #status-salvamento {
            display: block;
            min-height: 18px;
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .motor-info {
            font-size: 14px;
            color: var(--text-muted);
            text-align: right;
        }

        .admin-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        #admin-info {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
            transition:
                filter 0.2s,
                transform 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #101018;
        }

        .btn-secondary {
            background-color: #3b3b52;
            color: var(--text-main);
        }

        .btn-danger {
            background-color: var(--alert-red);
            color: white;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(300px, 1fr)
            );
            gap: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 20px;
            color: var(--text-muted);
        }

        .valor-display {
            font-size: 40px;
            font-weight: bold;
            margin: 10px 0;
        }

        .unidade {
            font-size: 18px;
            color: #888;
        }

        .chart-container {
            width: 100%;
            height: 200px;
            margin-top: 15px;
        }

        .status-on {
            color: var(--ok-green);
            font-weight: bold;
        }

        /*
         * JANELA DE CONFIGURAÇÕES
         */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.75);
        }

        .modal.aberto {
            display: flex;
        }

        .modal-conteudo {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: var(--panel-bg);
            border: 1px solid #34344a;
            border-radius: 14px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.55);
        }

        .modal-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px;
            border-bottom: 1px solid #34344a;
        }

        .modal-cabecalho h2 {
            margin: 0;
            color: var(--accent-blue);
        }

        .btn-fechar {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        .modal-corpo {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-grupo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-grupo.nome-completo {
            grid-column: 1 / -1;
        }

        .form-grupo label {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .form-grupo input,
        .form-grupo select {
            width: 100%;
            background-color: var(--panel-secondary);
            color: var(--text-main);
            border: 1px solid #41415a;
            border-radius: 7px;
            padding: 11px;
            font-size: 15px;
            outline: none;
        }

        .form-grupo input:focus,
        .form-grupo select:focus {
            border-color: var(--accent-blue);
        }

        #mensagem-config {
            display: block;
            min-height: 20px;
            margin-top: 15px;
            font-size: 13px;
        }

        .modal-rodape {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #34344a;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .motor-title input {
                width: 100%;
                font-size: 22px;
            }

            .motor-info {
                text-align: left;
            }

            .admin-controls {
                justify-content: flex-start;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-grupo.nome-completo {
                grid-column: auto;
            }

            .modal-rodape {
                flex-direction: column-reverse;
            }

            .modal-rodape .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="motor-title">
            <label for="nome-motor">
                NOME DO EQUIPAMENTO:
            </label>

            <input
                type="text"
                id="nome-motor"
                value="Motor do rolo de água da unidade 1"
                maxlength="80"
                disabled
            >

            <span id="status-salvamento"></span>
        </div>

        <div class="motor-info">
            <strong>Status:</strong>
            <span class="status-on">ATIVO 🟢</span>
            <br>

            <strong>Tempo de Atividade:</strong>
            <span id="uptime">00:00:00</span>
            <br>

            <strong>Especificações:</strong>
            <span id="especificacoes-motor">
                Trifásico 220V | 5 CV | 1750 RPM
            </span>

            <div class="admin-controls">
                <span id="admin-info">Visitante</span>

                <button
                    type="button"
                    id="btn-configuracoes"
                    class="btn btn-secondary"
                    hidden
                >
                    ⚙ Configurações
                </button>

                <button
                    type="button"
                    id="btn-login"
                    class="btn btn-primary"
                >
                    Entrar com Google
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-grid">

        <section
            class="card"
            style="border-top: 4px solid var(--alert-red);"
        >
            <h2>Temperatura</h2>

            <div>
                <span
                    class="valor-display"
                    id="val-temp"
                >--</span>

                <span class="unidade">°C</span>
            </div>

            <div class="chart-container">
                <canvas id="graficoTemp"></canvas>
            </div>
        </section>

        <section
            class="card"
            style="border-top: 4px solid var(--ok-green);"
        >
            <h2>Corrente (RMS)</h2>

            <div>
                <span
                    class="valor-display"
                    id="val-corrente"
                >--</span>

                <span class="unidade">A</span>
            </div>

            <div class="chart-container">
                <canvas id="graficoCorrente"></canvas>
            </div>
        </section>

        <section
            class="card"
            style="border-top: 4px solid var(--warn-yellow);"
        >
            <h2>Vibração (Pico)</h2>

            <div>
                <span
                    class="valor-display"
                    id="val-vibracao"
                >--</span>

                <span class="unidade">mm/s</span>
            </div>

            <div class="chart-container">
                <canvas id="graficoVibracao"></canvas>
            </div>
        </section>

    </main>

    <!-- JANELA DE CONFIGURAÇÕES -->

    <div
        id="modal-config"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="titulo-modal"
        aria-hidden="true"
    >
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h2 id="titulo-modal">
                    Configurações do motor
                </h2>

                <button
                    type="button"
                    id="btn-fechar-modal"
                    class="btn-fechar"
                    aria-label="Fechar configurações"
                >
                    ×
                </button>
            </div>

            <div class="modal-corpo">
                <div class="form-grid">

                    <div class="form-grupo nome-completo">
                        <label for="config-nome">
                            Nome do equipamento
                        </label>

                        <input
                            type="text"
                            id="config-nome"
                            maxlength="80"
                        >
                    </div>

                    <div class="form-grupo">
                        <label for="config-alimentacao">
                            Tipo de alimentação
                        </label>

                        <select id="config-alimentacao">
                            <option value="Monofásico">
                                Monofásico
                            </option>

                            <option value="Bifásico">
                                Bifásico
                            </option>

                            <option value="Trifásico">
                                Trifásico
                            </option>
                        </select>
                    </div>

                    <div class="form-grupo">
                        <label for="config-tensao">
                            Tensão (V)
                        </label>

                        <input
                            type="number"
                            id="config-tensao"
                            min="1"
                            max="10000"
                            step="1"
                        >
                    </div>

                    <div class="form-grupo">
                        <label for="config-potencia">
                            Potência (CV)
                        </label>

                        <input
                            type="number"
                            id="config-potencia"
                            min="0.01"
                            max="10000"
                            step="0.01"
                        >
                    </div>

                    <div class="form-grupo">
                        <label for="config-rotacao">
                            Rotação (RPM)
                        </label>

                        <input
                            type="number"
                            id="config-rotacao"
                            min="1"
                            max="100000"
                            step="1"
                        >
                    </div>
                </div>

                <span id="mensagem-config"></span>
            </div>

            <div class="modal-rodape">
                <button
                    type="button"
                    id="btn-cancelar-config"
                    class="btn btn-secondary"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btn-salvar-config"
                    class="btn btn-primary"
                >
                    Salvar configurações
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            set,
            get,
            update
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAc6EkUGTdk7V78rl74Gs66t2mLtH1-lzY",
            authDomain: "tcc-motor-senai.firebaseapp.com",
            databaseURL: "https://tcc-motor-senai-default-rtdb.firebaseio.com",
            projectId: "tcc-motor-senai",
            storageBucket: "tcc-motor-senai.firebasestorage.app",
            messagingSenderId: "964076129849",
            appId: "1:964076129849:web:2e86e2b9ee2af7ef5cc7e8"
        };

        const ADMIN_UID =
            "dWIQZl24FLgywSmYxboFIsU1Z6B3";

        const MOTOR_ID = "motor01";

        const CAMINHO_MOTOR =
            `motores/${MOTOR_ID}`;

        const CAMINHO_CONFIGURACOES =
            `${CAMINHO_MOTOR}/configuracoes`;

        const CAMINHO_DADOS_ATUAIS =
            `${CAMINHO_MOTOR}/dadosAtuais`;

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const googleProvider =
            new GoogleAuthProvider();

        const btnLogin =
            document.getElementById('btn-login');

        const btnConfiguracoes =
            document.getElementById(
                'btn-configuracoes'
            );

        const adminInfo =
            document.getElementById('admin-info');

        const inputNome =
            document.getElementById('nome-motor');

        const statusSalvamento =
            document.getElementById(
                'status-salvamento'
            );

        const especificacoesMotor =
            document.getElementById(
                'especificacoes-motor'
            );

        const modalConfig =
            document.getElementById(
                'modal-config'
            );

        const btnFecharModal =
            document.getElementById(
                'btn-fechar-modal'
            );

        const btnCancelarConfig =
            document.getElementById(
                'btn-cancelar-config'
            );

        const btnSalvarConfig =
            document.getElementById(
                'btn-salvar-config'
            );

        const configNome =
            document.getElementById(
                'config-nome'
            );

        const configAlimentacao =
            document.getElementById(
                'config-alimentacao'
            );

        const configTensao =
            document.getElementById(
                'config-tensao'
            );

        const configPotencia =
            document.getElementById(
                'config-potencia'
            );

        const configRotacao =
            document.getElementById(
                'config-rotacao'
            );

        const mensagemConfig =
            document.getElementById(
                'mensagem-config'
            );

        let configuracoesAtuais = {
            nomeMotor:
                "Motor do rolo de água da unidade 1",

            especificacoes: {
                tipoAlimentacao: "Trifásico",
                tensaoVolts: 220,
                potenciaCV: 5,
                rotacaoRPM: 1750
            }
        };

        /*
         * CRIAÇÃO INICIAL DO MOTOR
         */

        async function inicializarMotor(usuario) {
            if (
                !usuario ||
                usuario.uid !== ADMIN_UID
            ) {
                return;
            }

            const configuracoesRef = ref(
                db,
                CAMINHO_CONFIGURACOES
            );

            const snapshot =
                await get(configuracoesRef);

            if (snapshot.exists()) {
                return;
            }

            const nomeAntigoSnapshot =
                await get(
                    ref(
                        db,
                        'configuracoes/nomeMotor'
                    )
                );

            let nomeInicial =
                "Motor do rolo de água da unidade 1";

            if (nomeAntigoSnapshot.exists()) {
                nomeInicial =
                    nomeAntigoSnapshot.val();
            }

            await set(
                configuracoesRef,
                {
                    nomeMotor: nomeInicial,

                    especificacoes: {
                        tipoAlimentacao:
                            "Trifásico",

                        tensaoVolts: 220,
                        potenciaCV: 5,
                        rotacaoRPM: 1750
                    }
                }
            );
        }

        /*
         * AUTENTICAÇÃO
         */

        btnLogin.addEventListener(
            'click',
            async () => {
                try {
                    if (auth.currentUser) {
                        await signOut(auth);
                    } else {
                        await signInWithPopup(
                            auth,
                            googleProvider
                        );
                    }
                } catch (error) {
                    console.error(
                        "Erro de autenticação:",
                        error
                    );

                    alert(
                        "Não foi possível realizar o login.\n\n" +
                        error.message
                    );
                }
            }
        );

        onAuthStateChanged(
            auth,
            async (usuario) => {
                if (!usuario) {
                    btnLogin.innerText =
                        "Entrar com Google";

                    adminInfo.innerText =
                        "Visitante";

                    inputNome.disabled = true;
                    btnConfiguracoes.hidden = true;

                    fecharModal();
                    return;
                }

                btnLogin.innerText = "Sair";

                if (usuario.uid === ADMIN_UID) {
                    adminInfo.innerText =
                        "Administrador";

                    inputNome.disabled = false;
                    btnConfiguracoes.hidden = false;

                    try {
                        await inicializarMotor(
                            usuario
                        );
                    } catch (error) {
                        console.error(
                            "Erro ao preparar o motor:",
                            error
                        );
                    }
                } else {
                    adminInfo.innerText =
                        "Usuário sem permissão";

                    inputNome.disabled = true;
                    btnConfiguracoes.hidden = true;

                    fecharModal();
                }
            }
        );

        /*
         * ACOMPANHAMENTO DAS CONFIGURAÇÕES
         */

        onValue(
            ref(
                db,
                CAMINHO_CONFIGURACOES
            ),
            (snapshot) => {
                if (!snapshot.exists()) {
                    return;
                }

                configuracoesAtuais =
                    snapshot.val();

                const nome =
                    configuracoesAtuais
                        .nomeMotor;

                const especificacoes =
                    configuracoesAtuais
                        .especificacoes;

                if (nome) {
                    inputNome.value = nome;
                }

                if (especificacoes) {
                    const tipo =
                        especificacoes
                            .tipoAlimentacao ?? "--";

                    const tensao =
                        especificacoes
                            .tensaoVolts ?? "--";

                    const potencia =
                        especificacoes
                            .potenciaCV ?? "--";

                    const rotacao =
                        especificacoes
                            .rotacaoRPM ?? "--";

                    especificacoesMotor.innerText =
                        `${tipo} ${tensao}V | ` +
                        `${potencia} CV | ` +
                        `${rotacao} RPM`;
                }
            }
        );

        /*
         * EDIÇÃO RÁPIDA DO NOME
         */

        async function salvarNomeMotor() {
            const usuario = auth.currentUser;

            if (
                !usuario ||
                usuario.uid !== ADMIN_UID
            ) {
                return;
            }

            const novoNome =
                inputNome.value.trim();

            if (
                novoNome.length === 0 ||
                novoNome.length > 80
            ) {
                statusSalvamento.innerText =
                    "Digite um nome entre 1 e 80 caracteres.";

                statusSalvamento.style.color =
                    "var(--alert-red)";

                return;
            }

            try {
                statusSalvamento.innerText =
                    "Salvando...";

                statusSalvamento.style.color =
                    "var(--warn-yellow)";

                await set(
                    ref(
                        db,
                        `${CAMINHO_CONFIGURACOES}/nomeMotor`
                    ),
                    novoNome
                );

                statusSalvamento.innerText =
                    "Nome salvo ✓";

                statusSalvamento.style.color =
                    "var(--ok-green)";

                setTimeout(() => {
                    statusSalvamento.innerText = "";
                }, 2000);
            } catch (error) {
                console.error(
                    "Erro ao salvar o nome:",
                    error
                );

                statusSalvamento.innerText =
                    "Erro ao salvar o nome.";

                statusSalvamento.style.color =
                    "var(--alert-red)";
            }
        }

        inputNome.addEventListener(
            'blur',
            salvarNomeMotor
        );

        inputNome.addEventListener(
            'keydown',
            (evento) => {
                if (evento.key === 'Enter') {
                    inputNome.blur();
                }
            }
        );

        /*
         * JANELA DE CONFIGURAÇÕES
         */

        function abrirModal() {
            const especificacoes =
                configuracoesAtuais
                    .especificacoes || {};

            configNome.value =
                configuracoesAtuais
                    .nomeMotor || "";

            configAlimentacao.value =
                especificacoes
                    .tipoAlimentacao ||
                "Trifásico";

            configTensao.value =
                especificacoes
                    .tensaoVolts ?? 220;

            configPotencia.value =
                especificacoes
                    .potenciaCV ?? 5;

            configRotacao.value =
                especificacoes
                    .rotacaoRPM ?? 1750;

            mensagemConfig.innerText = "";

            modalConfig.classList.add(
                'aberto'
            );

            modalConfig.setAttribute(
                'aria-hidden',
                'false'
            );

            configNome.focus();
        }

        function fecharModal() {
            modalConfig.classList.remove(
                'aberto'
            );

            modalConfig.setAttribute(
                'aria-hidden',
                'true'
            );

            mensagemConfig.innerText = "";
        }

        btnConfiguracoes.addEventListener(
            'click',
            abrirModal
        );

        btnFecharModal.addEventListener(
            'click',
            fecharModal
        );

        btnCancelarConfig.addEventListener(
            'click',
            fecharModal
        );

        modalConfig.addEventListener(
            'click',
            (evento) => {
                if (evento.target === modalConfig) {
                    fecharModal();
                }
            }
        );

        document.addEventListener(
            'keydown',
            (evento) => {
                if (
                    evento.key === 'Escape' &&
                    modalConfig.classList
                        .contains('aberto')
                ) {
                    fecharModal();
                }
            }
        );

        btnSalvarConfig.addEventListener(
            'click',
            async () => {
                const usuario =
                    auth.currentUser;

                if (
                    !usuario ||
                    usuario.uid !== ADMIN_UID
                ) {
                    mensagemConfig.innerText =
                        "Você não possui permissão.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";

                    return;
                }

                const nome =
                    configNome.value.trim();

                const alimentacao =
                    configAlimentacao.value;

                const tensao =
                    Number(configTensao.value);

                const potencia =
                    Number(configPotencia.value);

                const rotacao =
                    Number(configRotacao.value);

                if (
                    nome.length === 0 ||
                    nome.length > 80
                ) {
                    mensagemConfig.innerText =
                        "Informe um nome entre 1 e 80 caracteres.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";

                    return;
                }

                if (
                    !Number.isFinite(tensao) ||
                    tensao <= 0 ||
                    tensao > 10000
                ) {
                    mensagemConfig.innerText =
                        "Informe uma tensão válida.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";

                    return;
                }

                if (
                    !Number.isFinite(potencia) ||
                    potencia <= 0 ||
                    potencia > 10000
                ) {
                    mensagemConfig.innerText =
                        "Informe uma potência válida.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";

                    return;
                }

                if (
                    !Number.isFinite(rotacao) ||
                    rotacao <= 0 ||
                    rotacao > 100000
                ) {
                    mensagemConfig.innerText =
                        "Informe uma rotação válida.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";

                    return;
                }

                try {
                    btnSalvarConfig.disabled = true;

                    mensagemConfig.innerText =
                        "Salvando configurações...";

                    mensagemConfig.style.color =
                        "var(--warn-yellow)";

                    await update(
                        ref(
                            db,
                            CAMINHO_CONFIGURACOES
                        ),
                        {
                            nomeMotor: nome,

                            especificacoes: {
                                tipoAlimentacao:
                                    alimentacao,

                                tensaoVolts:
                                    tensao,

                                potenciaCV:
                                    potencia,

                                rotacaoRPM:
                                    rotacao
                            }
                        }
                    );

                    mensagemConfig.innerText =
                        "Configurações salvas ✓";

                    mensagemConfig.style.color =
                        "var(--ok-green)";

                    setTimeout(() => {
                        fecharModal();
                    }, 700);
                } catch (error) {
                    console.error(
                        "Erro ao salvar configurações:",
                        error
                    );

                    mensagemConfig.innerText =
                        "Erro ao salvar as configurações.";

                    mensagemConfig.style.color =
                        "var(--alert-red)";
                } finally {
                    btnSalvarConfig.disabled =
                        false;
                }
            }
        );

        /*
         * GRÁFICOS
         */

        const maxPontos = 15;

        function criarGrafico(
            ctxId,
            corLinha
        ) {
            return new Chart(
                document.getElementById(ctxId),
                {
                    type: 'line',

                    data: {
                        labels: [],

                        datasets: [{
                            data: [],
                            borderColor: corLinha,
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            }
                        },

                        scales: {
                            x: {
                                display: false
                            },

                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                }
            );
        }

        const chartTemp = criarGrafico(
            'graficoTemp',
            '#ff4757'
        );

        const chartCorrente = criarGrafico(
            'graficoCorrente',
            '#2ed573'
        );

        const chartVibracao = criarGrafico(
            'graficoVibracao',
            '#ffa502'
        );

        function atualizarGrafico(
            chart,
            valor
        ) {
            const agora =
                new Date().toLocaleTimeString();

            chart.data.labels.push(agora);

            chart.data.datasets[0]
                .data.push(valor);

            if (
                chart.data.labels.length >
                maxPontos
            ) {
                chart.data.labels.shift();

                chart.data.datasets[0]
                    .data.shift();
            }

            chart.update();
        }

        /*
         * DADOS ATUAIS DOS SENSORES
         */

        function acompanharSensor(
            nomeSensor,
            elementoId,
            casasDecimais,
            chart
        ) {
            onValue(
                ref(
                    db,
                    `${CAMINHO_DADOS_ATUAIS}/${nomeSensor}`
                ),
                (snapshot) => {
                    const elemento =
                        document.getElementById(
                            elementoId
                        );

                    if (!snapshot.exists()) {
                        elemento.innerText = "--";
                        return;
                    }

                    const valor =
                        Number(snapshot.val());

                    if (!Number.isFinite(valor)) {
                        elemento.innerText = "--";
                        return;
                    }

                    elemento.innerText =
                        valor.toFixed(
                            casasDecimais
                        );

                    atualizarGrafico(
                        chart,
                        valor
                    );
                }
            );
        }

        acompanharSensor(
            'temperatura',
            'val-temp',
            1,
            chartTemp
        );

        acompanharSensor(
            'corrente',
            'val-corrente',
            2,
            chartCorrente
        );

        acompanharSensor(
            'vibracao',
            'val-vibracao',
            2,
            chartVibracao
        );

        /*
         * UPTIME TEMPORÁRIO
         */

        let segundosAtivo = 0;

        setInterval(() => {
            segundosAtivo++;

            const horas = Math.floor(
                segundosAtivo / 3600
            );

            const minutos = Math.floor(
                (segundosAtivo % 3600) / 60
            );

            const segundos =
                segundosAtivo % 60;

            document.getElementById(
                'uptime'
            ).innerText =
                String(horas).padStart(2, '0') +
                ":" +
                String(minutos).padStart(2, '0') +
                ":" +
                String(segundos).padStart(2, '0');
        }, 1000);
    </script>

</body>
</html>
